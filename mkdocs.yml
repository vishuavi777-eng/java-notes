site_name: Vishwambhar Patil Notes
site_description: Personal Knowledge Base for Java, DSA, Spring Boot, and System Design
site_author: Vishwambhar Patil
copyright: Copyright &copy; 2026 Vishwambhar Patil

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang: en

extra_javascript:
  - assets/javascripts/study-progress.js?v=20260519-1
  - assets/javascripts/interview-question-bank.js?v=20260515-1
  - assets/javascripts/interview-practice.js?v=20260515-1

extra_css:
  - assets/stylesheets/study-progress.css?v=20260519-1

theme:
  name: material
  language: en
  icon:
    logo: material/school-outline
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

